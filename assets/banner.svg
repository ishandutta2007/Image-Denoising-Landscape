<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Card Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#38bdf8;#a855f7;#06b6d4;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#ec4899;#06b6d4;#a855f7;#ec4899" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Scanner Gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="90%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <!-- Laser Beam Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="laserGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }

    @keyframes scanLineAnim {
      0% { transform: translateX(50px); }
      50% { transform: translateX(720px); }
      100% { transform: translateX(50px); }
    }

    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) scale(0.9); opacity: 0.2; }
      50% { transform: translateY(-12px) scale(1.3); opacity: 0.85; }
    }

    @keyframes flickerNoise {
      0%, 100% { opacity: 0.15; }
      25% { opacity: 0.45; }
      50% { opacity: 0.2; }
      75% { opacity: 0.55; }
    }

    .pulsing-orb {
      transform-origin: center;
      animation: pulseGlow 5s ease-in-out infinite;
    }

    .flickering-noise {
      animation: flickerNoise 2.5s steps(4) infinite;
    }

    .scan-beam {
      animation: scanLineAnim 6s ease-in-out infinite;
    }

    .particle-1 { animation: floatParticle 4s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 3.2s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 4.5s ease-in-out infinite 2s; }
    .particle-4 { animation: floatParticle 3.8s ease-in-out infinite 0.5s; }

    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 2.5px;
    }

    .tag-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
    }
  </style>

  <!-- Background Base -->
  <rect x="2" y="2" width="896" height="316" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="896" height="316" rx="16" fill="url(#cyberGrid)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="150" cy="80" r="120" fill="#0284c7" opacity="0.25" filter="url(#glow)" class="pulsing-orb" />
  <circle cx="750" cy="220" r="140" fill="#9333ea" opacity="0.25" filter="url(#glow)" class="pulsing-orb" style="animation-delay: 2.5s;" />
  <circle cx="450" cy="160" r="100" fill="#06b6d4" opacity="0.15" filter="url(#glow)" class="pulsing-orb" style="animation-delay: 1.2s;" />

  <!-- Noise Simulation Area (Left to Right Transformation Background) -->
  <g class="flickering-noise">
    <!-- Simulated noisy grain pixels on left side -->
    <rect x="60" y="45" width="3" height="3" fill="#38bdf8" />
    <rect x="85" y="70" width="2" height="2" fill="#a855f7" />
    <rect x="110" y="35" width="4" height="2" fill="#ec4899" />
    <rect x="130" y="90" width="2" height="3" fill="#38bdf8" />
    <rect x="75" y="130" width="3" height="2" fill="#94a3b8" />
    <rect x="95" y="160" width="2" height="2" fill="#38bdf8" />
    <rect x="140" y="145" width="3" height="3" fill="#a855f7" />
    <rect x="65" y="200" width="2" height="2" fill="#cbd5e1" />
    <rect x="120" y="220" width="4" height="2" fill="#38bdf8" />
    <rect x="90" y="250" width="3" height="3" fill="#ec4899" />
    <rect x="150" y="265" width="2" height="4" fill="#a855f7" />
    <rect x="175" y="60" width="3" height="2" fill="#38bdf8" />
    <rect x="190" y="180" width="2" height="2" fill="#cbd5e1" />
    <rect x="210" y="240" width="3" height="3" fill="#38bdf8" />
    <rect x="225" y="95" width="2" height="3" fill="#a855f7" />
    
    <!-- More scattered dynamic noise points -->
    <circle cx="160" cy="115" r="1.5" fill="#f43f5e" />
    <circle cx="230" cy="150" r="1.5" fill="#38bdf8" />
    <circle cx="180" cy="210" r="2" fill="#818cf8" />
    <circle cx="250" cy="70" r="1.5" fill="#c084fc" />
    <circle cx="270" cy="260" r="2" fill="#38bdf8" />
  </g>

  <!-- Clean Mathematical Wave / Restored Signal Lines -->
  <g opacity="0.35">
    <path d="M 400,240 C 480,180 540,280 620,220 C 700,160 760,260 840,200" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 4" />
    <path d="M 420,250 C 500,190 560,290 640,230 C 720,170 780,270 860,210" fill="none" stroke="#c084fc" stroke-width="1.8" />
    <path d="M 380,230 C 460,170 520,270 600,210 C 680,150 740,250 820,190" fill="none" stroke="#06b6d4" stroke-width="1" />
  </g>

  <!-- Floating Deep Learning Network Nodes / Particles -->
  <g class="particle-1">
    <circle cx="780" cy="75" r="4" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="780" cy="75" r="12" fill="none" stroke="#38bdf8" stroke-width="0.75" opacity="0.5" />
    <line x1="780" y1="75" x2="830" y2="110" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
  </g>
  <g class="particle-2">
    <circle cx="830" cy="110" r="3.5" fill="#a855f7" filter="url(#glow)" />
    <line x1="830" y1="110" x2="790" y2="155" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1" />
  </g>
  <g class="particle-3">
    <circle cx="790" cy="155" r="4" fill="#ec4899" filter="url(#glow)" />
    <line x1="790" y1="155" x2="845" y2="185" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1" />
  </g>
  <g class="particle-4">
    <circle cx="845" cy="185" r="3" fill="#06b6d4" filter="url(#glow)" />
    <circle cx="845" cy="185" r="8" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.6" />
  </g>

  <!-- Restored Crisp Aperture / Target Reticle -->
  <g transform="translate(100, 100)" opacity="0.65">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="8 4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="0" cy="0" r="3" fill="#38bdf8" />
    <line x1="-34" y1="0" x2="-22" y2="0" stroke="#38bdf8" stroke-width="2" />
    <line x1="22" y1="0" x2="34" y2="0" stroke="#38bdf8" stroke-width="2" />
    <line x1="0" y1="-34" x2="0" y2="-22" stroke="#38bdf8" stroke-width="2" />
    <line x1="0" y1="22" x2="0" y2="34" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Main Banner Header Content -->
  <g transform="translate(450, 95)" text-anchor="middle">
    <!-- Top Pill / Category Tag -->
    <g transform="translate(0, -32)">
      <rect x="-140" y="-14" width="280" height="26" rx="13" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
      <circle cx="-118" cy="-1" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1; 0.3; 1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="-106" y="3" fill="#38bdf8" class="tag-badge" text-anchor="start">CURATED RESEARCH &amp; SOTA SUITE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="38" class="title-text" font-size="44" fill="url(#textGrad)" filter="url(#glow)">IMAGE DENOISING</text>
    <text x="0" y="80" class="subtitle-text" font-size="20" fill="#94a3b8">L A N D S C A P E</text>
  </g>

  <!-- Feature Pills / Badges at bottom -->
  <g transform="translate(450, 240)" text-anchor="middle">
    <!-- Pill 1: Deep Learning -->
    <g transform="translate(-240, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="7" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <text x="0" y="4.5" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">⚡ Transformers &amp; CNNs</text>
    </g>

    <!-- Pill 2: Diffusion & SOTA -->
    <g transform="translate(-75, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="7" fill="rgba(15, 23, 42, 0.85)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6" />
      <text x="0" y="4.5" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✨ Diffusion &amp; Flow Models</text>
    </g>

    <!-- Pill 3: Self-Supervised -->
    <g transform="translate(95, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="7" fill="rgba(15, 23, 42, 0.85)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6" />
      <text x="0" y="4.5" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">🎯 Zero-Shot &amp; Noise2Noise</text>
    </g>

    <!-- Pill 4: Datasets -->
    <g transform="translate(255, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="7" fill="rgba(15, 23, 42, 0.85)" stroke="#f472b6" stroke-width="1" stroke-opacity="0.6" />
      <text x="0" y="4.5" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">📊 Benchmarks &amp; SOTA</text>
    </g>
  </g>

  <!-- Interactive Dynamic Denoising Laser Scan Beam across Banner -->
  <g class="scan-beam">
    <!-- Laser Glow Gradient -->
    <rect x="-80" y="6" width="80" height="308" fill="url(#scanGrad)" />
    <!-- Laser Line -->
    <line x1="0" y1="8" x2="0" y2="312" stroke="#ffffff" stroke-width="2.5" filter="url(#laserGlow)" />
    <line x1="0" y1="8" x2="0" y2="312" stroke="#38bdf8" stroke-width="5" opacity="0.6" filter="url(#laserGlow)" />
    
    <!-- Top & Bottom Glowing Beads on Scanner -->
    <circle cx="0" cy="12" r="4" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="3;6;3" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="308" r="4" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="3;6;3" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Sleek Outer Border Frame -->
  <rect x="2" y="2" width="896" height="316" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2" />
</svg>
