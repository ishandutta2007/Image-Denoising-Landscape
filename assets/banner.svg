<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 900 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="borderGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".8"><animate attributeName="stop-color" dur="8s" repeatCount="indefinite" values="#38bdf8;#a855f7;#06b6d4;#38bdf8"/></stop><stop offset="50%" stop-color="#818cf8" stop-opacity=".3"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".8"><animate attributeName="stop-color" dur="8s" repeatCount="indefinite" values="#ec4899;#06b6d4;#a855f7;#ec4899"/></stop></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="45%" stop-color="#818cf8"/><stop offset="70%" stop-color="#c084fc"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><linearGradient id="scanGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/><stop offset="50%" stop-color="#38bdf8" stop-opacity=".45"/><stop offset="90%" stop-color="#38bdf8" stop-opacity=".9"/><stop offset="100%" stop-color="#fff" stop-opacity="1"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="laserGlow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="4"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1" d="M 30 0 L 0 0 0 30"/></pattern></defs><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}@keyframes scanLineAnim{0%{transform:translateX(50px)}50%{transform:translateX(720px)}}@keyframes floatParticle{0%{transform:translateY(0) scale(.9);opacity:.2}50%{transform:translateY(-12px) scale(1.3);opacity:.85}}@keyframes flickerNoise{0%{opacity:.15}25%{opacity:.45}50%{opacity:.2}75%{opacity:.55}}.pulsing-orb{transform-origin:center;animation:pulseGlow 5s ease-in-out infinite}.flickering-noise{animation:flickerNoise 2.5s steps(4) infinite}.scan-beam{animation:scanLineAnim 6s ease-in-out infinite}.particle-1{animation:floatParticle 4s ease-in-out infinite}.particle-2{animation:floatParticle 3.2s ease-in-out infinite 1s}.particle-3{animation:floatParticle 4.5s ease-in-out infinite 2s}.particle-4{animation:floatParticle 3.8s ease-in-out infinite .5s}.subtitle-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:900;letter-spacing:-.5px}.subtitle-text{font-weight:500;letter-spacing:2.5px}.tag-badge{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:11px;font-weight:600}</style><rect width="896" height="316" x="2" y="2" fill="url(#bgGrad)" rx="16"/><rect width="896" height="316" x="2" y="2" fill="url(#cyberGrid)" rx="16"/><circle cx="150" cy="80" r="120" fill="#0284c7" class="pulsing-orb" filter="url(#glow)" opacity=".25"/><circle cx="750" cy="220" r="140" fill="#9333ea" class="pulsing-orb" filter="url(#glow)" opacity=".25" style="animation-delay:2.5s"/><circle cx="450" cy="160" r="100" fill="#06b6d4" class="pulsing-orb" filter="url(#glow)" opacity=".15" style="animation-delay:1.2s"/><g class="flickering-noise"><rect width="3" height="3" x="60" y="45" fill="#38bdf8"/><rect width="2" height="2" x="85" y="70" fill="#a855f7"/><rect width="4" height="2" x="110" y="35" fill="#ec4899"/><rect width="2" height="3" x="130" y="90" fill="#38bdf8"/><rect width="3" height="2" x="75" y="130" fill="#94a3b8"/><rect width="2" height="2" x="95" y="160" fil